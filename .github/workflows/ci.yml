name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Security audit (dependencies)
        run: |
          for i in 1 2 3; do composer audit && exit 0; echo "composer audit attempt $i failed (likely transient network), retrying in 5s"; sleep 5; done
          composer audit

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      # Fails if a __() string has no es/pt translation, or if a lang file was
      # hand-edited / the generator was never re-run. Needs vendor/ (laravel-lang
      # is the source of the framework strings), hence the position.
      - name: Translations (check in sync)
        run: node scripts/generate-translations.mjs --check

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Pest)
        run: php artisan test
